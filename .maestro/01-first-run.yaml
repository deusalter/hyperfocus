appId: com.deusalter.hyperfocus
name: First run
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Race your past self, gently."
    timeout: 60000
- takeScreenshot: 01-welcome
- tapOn: "Next"
- extendedWaitUntil:
    visible: "How it works"
    timeout: 5000
- takeScreenshot: 02-how-it-works
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Set your pace"
    timeout: 5000
- takeScreenshot: 03-set-your-pace
- tapOn: "Your name"
- inputText: "Sam"
- takeScreenshot: 04-pace-with-keyboard
- tapOn: "Let's go"
- extendedWaitUntil:
    visible: "Start a brain dump"
    timeout: 8000
- assertVisible: ".*, Sam"
- takeScreenshot: 05-home-empty
