appId: com.deusalter.hyperfocus
name: First run
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Race your past self, gently."
    timeout: 60000
- takeScreenshot: 01-welcome
- tapOn: "Next"
- extendedWaitUntil:
    visible: "How it works"
    timeout: 5000
- takeScreenshot: 02-how-it-works
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Start with one thing"
    timeout: 5000
# the field takes focus by itself, so the keyboard is already up
- inputText: "Clear the desk"
- takeScreenshot: 03-first-task-with-keyboard
- tapOn: "Start 5 minutes on it"
# The welcome ends inside a session, which is also the first time the system asks
# about notifications. Maestro's driver answers that prompt by itself.
- extendedWaitUntil:
    visible: "Focusing on"
    timeout: 10000
- takeScreenshot: 04-first-session
- tapOn: "Done with .*"
- extendedWaitUntil:
    visible: "Session complete"
    timeout: 6000
- takeScreenshot: 05-first-recap
- tapOn: "Back home"
# the one task is finished, so Home is empty again for the next flow
- extendedWaitUntil:
    visible: "Start a brain dump"
    timeout: 8000
- takeScreenshot: 06-home-empty
