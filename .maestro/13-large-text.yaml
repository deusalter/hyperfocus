appId: com.deusalter.hyperfocus
name: The largest text size
---
# Run with the phone at the largest accessibility size. Most of Home is below the
# fold there, so this scrolls to things instead of expecting them on screen.
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 01-home
- scrollUntilVisible:
    element: "Start one thing.*"
    # it's taller than a scroll step at this size, so half in view counts
    visibilityPercentage: 50
    centerElement: true
    direction: DOWN
    timeout: 30000
- takeScreenshot: 02-home-start
- scroll
- takeScreenshot: 03-home-list
# triage is the other screen that doesn't scroll as a whole
- scrollUntilVisible:
    element: "Sort 2 captured things"
    direction: UP
    timeout: 20000
- tapOn: "Sort 2 captured things"
- extendedWaitUntil:
    visible: "Text Maya back"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 03b-triage
- tapOn: "Close"
- runFlow:
    file: common/tab.yaml
    env:
      TAB: Calendar
- waitForAnimationToEnd
- takeScreenshot: 04-calendar
- runFlow:
    file: common/tab.yaml
    env:
      TAB: Insights
- waitForAnimationToEnd
- takeScreenshot: 05-insights
- runFlow:
    file: common/tab.yaml
    env:
      TAB: You
- waitForAnimationToEnd
- takeScreenshot: 06-you
- scroll
- takeScreenshot: 07-you-scrolled
- tapOn: "Brain dump"
- extendedWaitUntil:
    visible: "What's on your mind\\?"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 08-dump-with-keyboard
- tapOn: "Close"
- runFlow:
    file: common/tab.yaml
    env:
      TAB: Home
# Home kept its place further down the list
- scrollUntilVisible:
    element: "Start one thing.*"
    # it's taller than a scroll step at this size, so half in view counts
    visibilityPercentage: 50
    centerElement: true
    direction: UP
    timeout: 30000
- tapOn: "Start one thing.*"
# Maestro's iOS driver answers the system's notification prompt by itself. A tap
# of our own on "Allow" raced it, and once the prompt was gone the tap landed on
# the app at the same spot: on Focus at the largest text size, the Stop button.
- extendedWaitUntil:
    visible: "Focusing on"
    timeout: 8000
- waitForAnimationToEnd
- takeScreenshot: 09-focus
# every control has to be reachable, even if the screen has to scroll to show it
- scrollUntilVisible:
    element: "Done with .*"
    direction: DOWN
    timeout: 15000
- tapOn: "Done with .*"
- extendedWaitUntil:
    visible: "Session complete"
    timeout: 6000
- waitForAnimationToEnd
- takeScreenshot: 10-recap
- scrollUntilVisible:
    element: "Back home"
    direction: DOWN
    timeout: 15000
- takeScreenshot: 11-recap-bottom
