appId: com.deusalter.hyperfocus
name: Focus and recap screens
---
- launchApp
- extendedWaitUntil:
    visible: "Start one thing.*"
    timeout: 60000
- tapOn: "Start one thing.*"
# Maestro's iOS driver answers the system's notification prompt by itself. A tap
# of our own on "Allow" raced it, and once the prompt was gone the tap landed on
# the app at the same spot: on Focus at the largest text size, Stop without saving.
- extendedWaitUntil:
    visible: "Focusing on"
    timeout: 8000
- waitForAnimationToEnd
- takeScreenshot: focus
- tapOn: "Done with .*"
- extendedWaitUntil:
    visible: "Session complete"
    timeout: 6000
- waitForAnimationToEnd
- takeScreenshot: recap
