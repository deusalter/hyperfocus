appId: com.deusalter.hyperfocus
name: Store shot, recap
---
- launchApp
- extendedWaitUntil:
    visible: "Session in progress.*"
    timeout: 60000
- tapOn: "Session in progress.*"
- extendedWaitUntil:
    visible: "Focusing on"
    timeout: 8000
- tapOn: "Done with .*"
- extendedWaitUntil:
    visible: "Session complete"
    timeout: 8000
- waitForAnimationToEnd
- takeScreenshot: 05-recap
