appId: com.deusalter.hyperfocus
name: Gentle mode
---
- launchApp
- extendedWaitUntil:
    visible: "Start one thing.*"
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: 01-home
- runFlow:
    file: common/tab.yaml
    env:
      TAB: Insights
- waitForAnimationToEnd
- takeScreenshot: 02-insights
