appId: com.deusalter.hyperfocus
name: The session on the Lock Screen
---
- launchApp
- extendedWaitUntil:
    visible: "Start one thing.*"
    timeout: 45000
- tapOn: "Start one thing.*"
# The first session is also when the system asks about notifications. Maestro's
# iOS driver answers that prompt by itself, so this only waits for what's behind it.
- extendedWaitUntil:
    visible: "Focusing on"
    timeout: 10000
- takeScreenshot: 01-focus
# on the Home Screen, a phone with a Dynamic Island carries the countdown there
- pressKey: Home
- waitForAnimationToEnd
- takeScreenshot: 02-dynamic-island
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Focusing on"
    timeout: 10000
- pressKey: Lock
# Home wakes a locked phone to its Lock Screen. It takes a second press to unlock.
- pressKey: Home
# "until 6:24 PM" on its own is only ever the Live Activity. The app's own screens
# say "left, until" and "Focusing until".
- extendedWaitUntil:
    visible: "until .*"
    timeout: 10000
- takeScreenshot: 03-lock-screen-first-time
# The first Live Activity carries the system's own question underneath it. It isn't
# an alert, so Maestro's driver leaves it alone and this answers it.
- tapOn:
    text: "Always Allow|Allow"
    optional: true
- takeScreenshot: 04-lock-screen-running
# A few seconds on, for scripts/ios-sim.sh to compare with the one above. Finding
# the words isn't proof they're painted: a countdown once sat in the accessibility
# tree, invisible, and this flow passed. A painted countdown has moved by now.
- extendedWaitUntil:
    visible: "four seconds, and nothing by this name"
    timeout: 4000
    optional: true
- takeScreenshot: 04b-lock-screen-running-later
- pressKey: Home
- extendedWaitUntil:
    visible: "Pause"
    timeout: 10000
- tapOn: "Pause"
- extendedWaitUntil:
    visible: "Resume"
    timeout: 5000
- pressKey: Lock
- pressKey: Home
# the app says "Paused" too, but "left" by itself is the Live Activity's
- extendedWaitUntil:
    visible: "left"
    timeout: 10000
- takeScreenshot: 05-lock-screen-paused
# and the same gap while paused, where nothing should have moved
- extendedWaitUntil:
    visible: "four seconds, and nothing by this name"
    timeout: 4000
    optional: true
- takeScreenshot: 05b-lock-screen-paused-later
- pressKey: Home
- extendedWaitUntil:
    visible: "Resume"
    timeout: 10000
- tapOn: "Resume"
- tapOn: "Done with .*"
- extendedWaitUntil:
    visible: "Session complete"
    timeout: 8000
- tapOn: "Back home"
- extendedWaitUntil:
    visible: "Start one thing.*"
    timeout: 8000
# a finished session leaves nothing behind on the Lock Screen
- pressKey: Lock
- pressKey: Home
- extendedWaitUntil:
    notVisible: "until .*"
    timeout: 8000
- takeScreenshot: 06-lock-screen-after
