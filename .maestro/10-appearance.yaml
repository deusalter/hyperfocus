appId: com.deusalter.hyperfocus
name: Choosing dark
---
- launchApp
- extendedWaitUntil:
    visible: "Start one thing.*"
    timeout: 45000
- tapOn: "You"
- scrollUntilVisible:
    element: "Appearance"
    direction: DOWN
- tapOn: "Dark"
- waitForAnimationToEnd
- takeScreenshot: 01-you-dark
- tapOn: "Home"
- waitForAnimationToEnd
- takeScreenshot: 02-home-dark
# the keyboard is system UI, so this shows whether the override reaches it
- tapOn: "Brain dump"
- waitForAnimationToEnd
- takeScreenshot: 03-keyboard-dark
- tapOn: "Close"
# and whether it survives a restart
- launchApp
- extendedWaitUntil:
    visible: "Start one thing.*"
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: 04-home-dark-after-relaunch
- tapOn: "You"
- scrollUntilVisible:
    element: "Reset everything"
    direction: DOWN
- tapOn: "Reset everything"
- extendedWaitUntil:
    visible: "Reset everything\\?"
    timeout: 5000
- takeScreenshot: 05-alert-dark
- tapOn: "Cancel"
- scrollUntilVisible:
    element: "Auto"
    direction: UP
- tapOn: "Auto"
- waitForAnimationToEnd
- takeScreenshot: 06-auto
- tapOn: "Light"
- waitForAnimationToEnd
- takeScreenshot: 07-light-again
