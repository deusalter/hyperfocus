appId: com.deusalter.hyperfocus
name: System alerts
---
# react-native-web's Alert does nothing, so these have never been exercised
- launchApp
- extendedWaitUntil:
    visible: "Start one thing.*"
    timeout: 45000
- tapOn: "Start one thing.*"
# Maestro's iOS driver answers the system's notification prompt by itself. A tap
# of our own on "Allow" raced it, and once the prompt was gone the tap landed on
# the app at the same spot: on Focus at the largest text size, the Stop button.
- extendedWaitUntil:
    visible: "Focusing on"
    timeout: 8000
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Session in progress.*"
    timeout: 5000
# a second session while one is running has to ask
- tapOn: "Focus on .*"
- extendedWaitUntil:
    visible: "Already focusing"
    timeout: 5000
- takeScreenshot: 01-already-focusing
- tapOn: "Back to it"
- extendedWaitUntil:
    visible: "Focusing on"
    timeout: 5000
- tapOn: "Stop for now"
# under a minute in, so this one stops straight away
- extendedWaitUntil:
    visible: "Start one thing.*"
    timeout: 5000
- runFlow:
    file: common/tab.yaml
    env:
      TAB: You
- scrollUntilVisible:
    element: "Reset everything"
    direction: DOWN
- tapOn: "Reset everything"
- extendedWaitUntil:
    visible: "Reset everything\\?"
    timeout: 5000
- takeScreenshot: 02-reset-alert
- tapOn: "Cancel"
