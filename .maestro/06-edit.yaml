appId: com.deusalter.hyperfocus
name: Editing a task
---
- launchApp
- extendedWaitUntil:
    visible: "Start one thing.*"
    timeout: 45000
# the last row starts under the + button, which would take the tap
- scrollUntilVisible:
    element: "Clear the desk"
    direction: DOWN
    centerElement: true
- tapOn: "Clear the desk"
- extendedWaitUntil:
    visible: "What kind"
    timeout: 5000
- tapOn: "Fire.*"
- tapOn: "Tomorrow"
- tapOn: "Pick a date"
- waitForAnimationToEnd
- takeScreenshot: 01-date-picker
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Due Tomorrow"
    timeout: 5000
- takeScreenshot: 02-row-with-date
- tapOn: "Mark Clear the desk done"
# the toast stays eight seconds, so no stops between it and Undo
- tapOn: "Undo"
- extendedWaitUntil:
    visible: "Clear the desk"
    timeout: 5000
- takeScreenshot: 03-after-undo
