appId: com.deusalter.hyperfocus
name: Every screen on realistic data
---
- launchApp
- extendedWaitUntil:
    visible: "Start one thing.*"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 01-home
- scroll
- takeScreenshot: 02-home-scrolled
- runFlow:
    file: common/tab.yaml
    env:
      TAB: Calendar
- waitForAnimationToEnd
- takeScreenshot: 03-calendar
- runFlow:
    file: common/tab.yaml
    env:
      TAB: Insights
- waitForAnimationToEnd
- takeScreenshot: 04-insights
- runFlow:
    file: common/tab.yaml
    env:
      TAB: You
- waitForAnimationToEnd
- takeScreenshot: 05-you
- scroll
- takeScreenshot: 06-you-scrolled
- scroll
- takeScreenshot: 07-you-bottom
- runFlow:
    file: common/tab.yaml
    env:
      TAB: Home
- extendedWaitUntil:
    visible: "Start one thing.*"
    timeout: 5000
- tapOn: "Sort 2 captured things"
- waitForAnimationToEnd
- takeScreenshot: 08-triage
- tapOn: "Close"
- tapOn: "Brain dump"
- waitForAnimationToEnd
- takeScreenshot: 09-dump
- tapOn: "Close"
- tapOn: "Clear the desk"
- waitForAnimationToEnd
- takeScreenshot: 10-task-editor
- tapOn: "Close"
- runFlow:
    file: common/tab.yaml
    env:
      TAB: Calendar
- scrollUntilVisible:
    element: "Weekly debrief.*"
    direction: DOWN
- tapOn: "Weekly debrief.*"
- waitForAnimationToEnd
- takeScreenshot: 11-debrief
