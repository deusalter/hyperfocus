appId: com.deusalter.hyperfocus
name: The widget on the Home Screen
---
# The app writes what the widget shows whenever Today changes, so it has to have
# been opened once on this data.
- launchApp
- extendedWaitUntil:
    visible: "Start one thing.*"
    timeout: 45000
- pressKey: Home
- waitForAnimationToEnd
# a long press on an icon puts the Home Screen into its editing mode
- longPressOn: "Hyperfocus"
- extendedWaitUntil:
    visible: "Edit"
    timeout: 8000
- takeScreenshot: 01-editing
- tapOn: "Edit"
- takeScreenshot: 02-edit-menu
- tapOn:
    text: "Add Widget"
    optional: true
- takeScreenshot: 03-gallery
- tapOn:
    text: "Search Widgets"
    optional: true
- inputText:
    text: "Hyperfocus"
    optional: true
- takeScreenshot: 04-search
# The gallery's result row isn't in the accessibility tree at all: only the search
# field is, so there's no label to tap. It's the first row under the field.
- tapOn:
    point: "40%,29%"
- takeScreenshot: 05-preview
- tapOn:
    text: ".*Add Widget.*"
    optional: true
- takeScreenshot: 06-added
- tapOn:
    text: "Done"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 07-home-with-widget
# the widget's own words, which the app's icon doesn't carry
- extendedWaitUntil:
    visible: "Start one thing"
    timeout: 8000
    optional: true
- takeScreenshot: 08-widget-content
