appId: com.deusalter.hyperfocus
name: The widget on the Home Screen
---
# The app writes what the widget shows whenever Today changes, so it has to have
# been opened once on this data.
- launchApp
- extendedWaitUntil:
    visible: "Start one thing.*"
    timeout: 45000
- pressKey: Home
- waitForAnimationToEnd
# a long press on an icon puts the Home Screen into its editing mode
- longPressOn: "Hyperfocus"
- extendedWaitUntil:
    visible: "Edit"
    timeout: 8000
- takeScreenshot: 01-editing
- tapOn: "Edit"
- takeScreenshot: 02-edit-menu
- tapOn:
    text: "Add Widget"
    optional: true
- takeScreenshot: 03-gallery
- tapOn:
    text: "Search Widgets"
    optional: true
- inputText:
    text: "Hyperfocus"
    optional: true
- takeScreenshot: 04-search
# The gallery's result row isn't in the accessibility tree at all: only the search
# field is, so there's no label to tap. It's the first row under the field.
- tapOn:
    point: "40%,29%"
- takeScreenshot: 05-preview
- tapOn:
    text: ".*Add Widget.*"
    optional: true
- takeScreenshot: 06-added
- tapOn:
    text: "Done"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 07-home-with-widget
# The widget's own words, and the task the app wrote for it. The task only gets
# there through the App Group, so seeing it is the proof that path works.
- extendedWaitUntil:
    visible: "Start one thing"
    timeout: 10000
- assertVisible: "Draft intro for history essay"
- takeScreenshot: 08-widget-content
# a tap on it goes back into the app
- tapOn:
    point: "20%,15%"
- extendedWaitUntil:
    visible: "Not this one"
    timeout: 10000
    optional: true
- takeScreenshot: 09-after-tap
# The wider widget carries the race as well. Same way in, one swipe across in the
# gallery. Every step is allowed to miss: this half is here for its screenshots.
- pressKey: Home
- waitForAnimationToEnd
- longPressOn:
    text: "Fitness"
    optional: true
- tapOn:
    text: "Edit"
    optional: true
- tapOn:
    text: "Add Widget"
    optional: true
- tapOn:
    text: "Search Widgets"
    optional: true
- inputText:
    text: "Hyperfocus"
    optional: true
- tapOn:
    point: "40%,29%"
    optional: true
- swipe:
    start: 80%, 55%
    end: 20%, 55%
    optional: true
- takeScreenshot: 10-preview-medium
- tapOn:
    text: ".*Add Widget.*"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 11-home-with-both
