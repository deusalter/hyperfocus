appId: com.deusalter.hyperfocus
name: Keyboard never covers the field
---
- launchApp
- extendedWaitUntil:
    visible: "Start one thing.*"
    timeout: 45000
- runFlow:
    file: common/tab.yaml
    env:
      TAB: You
- scrollUntilVisible:
    element: "Connect"
    direction: DOWN
- tapOn: "Connect"
- waitForAnimationToEnd
- takeScreenshot: 01-feed-field-with-keyboard
- assertVisible: "Calendar feed link"
- inputText: "not a link"
# the card's own Connect gives way to the form's while the form is open
- tapOn: "Connect"
- waitForAnimationToEnd
- takeScreenshot: 02-feed-error
# the keyboard sits over the tab bar; dragging the page puts it away
- swipe:
    start: 50%, 30%
    end: 50%, 60%
- waitForAnimationToEnd
- takeScreenshot: 03-keyboard-dismissed
- runFlow:
    file: common/tab.yaml
    env:
      TAB: Calendar
- waitForAnimationToEnd
- tapOn: "Add something for today"
- waitForAnimationToEnd
- takeScreenshot: 04-calendar-add-with-keyboard
- inputText: "From the calendar"
- pressKey: Enter
- extendedWaitUntil:
    visible: "From the calendar"
    timeout: 5000
- takeScreenshot: 05-calendar-after-add
