appId: com.deusalter.hyperfocus
name: Capture and sort
---
# a fresh launch, so this also proves onboarding and the name were saved
- launchApp
- extendedWaitUntil:
    visible: "Start a brain dump"
    timeout: 45000
- tapOn: "Start a brain dump"
- extendedWaitUntil:
    visible: "Brain dump"
    timeout: 5000
- inputText: "Buy stamps"
- pressKey: Enter
- inputText: "Call dentist"
- pressKey: Enter
- inputText: "Water plants"
- pressKey: Enter
- inputText: "Clean desk"
- pressKey: Enter
- takeScreenshot: 01-dump
- assertVisible: "4 captured"
- tapOn: "Sort these 4"
- extendedWaitUntil:
    visible: "Clean desk"
    timeout: 5000
- takeScreenshot: 02-triage
# a real swipe right, which is what can conflict with closing the sheet
- swipe:
    from: "Clean desk"
    direction: RIGHT
- extendedWaitUntil:
    visible: "Water plants"
    timeout: 5000
- swipe:
    from: "Water plants"
    direction: LEFT
- extendedWaitUntil:
    visible: "Call dentist"
    timeout: 5000
- takeScreenshot: 03-after-two-swipes
- tapOn: "Let go"
- extendedWaitUntil:
    visible: "Let go of .*"
    timeout: 5000
- takeScreenshot: 04-undo-offered
- tapOn: "Undo"
- extendedWaitUntil:
    visible: "Call dentist"
    timeout: 5000
- tapOn: "Today"
- extendedWaitUntil:
    visible: "Buy stamps"
    timeout: 5000
- tapOn: "Today"
- extendedWaitUntil:
    visible: "All sorted."
    timeout: 5000
- takeScreenshot: 05-all-sorted
- tapOn: "Go to Today"
- extendedWaitUntil:
    visible: "Start one thing.*"
    timeout: 5000
- takeScreenshot: 06-home-with-tasks
